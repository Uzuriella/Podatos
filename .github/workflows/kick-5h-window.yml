name: Start Claude 5h window

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the busy :00/:30 marks GitHub often skips
  workflow_dispatch:
    inputs:
      force:
        description: "Ping even if a window seems active"
        type: boolean
        default: false

concurrency: { group: kick, cancel-in-progress: false }

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - name: Ping if idle
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: bash scripts/kick.sh
